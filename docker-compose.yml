services:
  mysql:
    image: mysql:8.4
    container_name: statlume-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-statlume_root_local}
      MYSQL_DATABASE: statlume
      MYSQL_USER: statlume
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-statlume_local}
      TZ: UTC
    command: ['--default-time-zone=+00:00']
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - statlume-mysql:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-statlume_root_local}',
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  statlume-mysql:
